name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m py_compile main.py tools/backend_smoke_check.py

      - name: Lint backend
        run: python -m ruff check main.py tools/backend_smoke_check.py

      - name: Backend smoke test
        run: python tools/backend_smoke_check.py

      - name: Business-logic checks
        run: |
          node tools/achievement_break_actions_check.cjs
          node tools/station_order_check.cjs
          node tools/station_asset_check.cjs
